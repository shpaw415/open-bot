<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1 id="title">Stock</h1>
    <form id="add">
      <input name="name" id="name-input" placeholder="Item name" required />
      <input
        name="qty"
        type="number"
        min="0"
        id="qty-input"
        placeholder="Qty"
        required
      />
      <button id="add-button">Add</button>
    </form>
    <table>
      <thead>
        <tr>
          <th id="th-item">Item</th>
          <th id="th-qty">Qty</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
