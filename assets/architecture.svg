<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>open-bot architecture: a control plane orchestrates a per-user desktop container and a per-user OpenViking memory container, exposed through a browser dashboard</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1180" height="620" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1179" height="619" rx="15.5" fill="none" stroke="#21262d"/>

  <!-- docker host -->
  <text x="590" y="48" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Docker host</text>
  <rect x="30" y="66" width="1120" height="380" rx="12" fill="#161b22" stroke="#30363d" stroke-dasharray="6 4"/>

  <!-- control plane -->
  <rect x="70" y="96" width="1040" height="120" rx="10" fill="#1c2431" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="100" y="128" fill="#2dd4bf" font-size="16" font-weight="700">Control plane</text>
  <text x="100" y="150" fill="#8b949e" font-size="13">Bun server · :8787</text>

  <rect x="330" y="112" width="250" height="88" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="350" y="138" fill="#e6edf3" font-size="13" font-weight="600">sqlite</text>
  <text x="350" y="158" fill="#8b949e" font-size="12.5">users · sessions · cron</text>
  <text x="350" y="177" fill="#8b949e" font-size="12.5">plugins · media · settings</text>

  <rect x="610" y="112" width="250" height="88" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="630" y="138" fill="#e6edf3" font-size="13" font-weight="600">Dashboard API</text>
  <text x="630" y="158" fill="#8b949e" font-size="12.5">auth · chat · config</text>
  <text x="630" y="177" fill="#8b949e" font-size="12.5">EventHub (WebSocket)</text>

  <rect x="890" y="112" width="190" height="88" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="910" y="138" fill="#e6edf3" font-size="13" font-weight="600">Orchestration</text>
  <text x="910" y="158" fill="#8b949e" font-size="12.5">starts/stops desktops</text>
  <text x="910" y="177" fill="#8b949e" font-size="12.5">per-user containers</text>

  <!-- docker api arrows -->
  <line x1="330" y1="216" x2="330" y2="266" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="985" y1="216" x2="985" y2="266" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="246" fill="#8b949e" font-size="13">docker API</text>
  <text x="1000" y="246" fill="#8b949e" font-size="13">docker API</text>

  <!-- desktop container -->
  <rect x="90" y="270" width="500" height="150" rx="10" fill="#1c2431" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="120" y="300" fill="#2dd4bf" font-size="16" font-weight="700">Desktop</text>
  <text x="195" y="300" fill="#8b949e" font-size="12.5">one container per user</text>

  <rect x="120" y="318" width="210" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="138" y="342" fill="#e6edf3" font-size="13" font-weight="600">OpenCode server</text>
  <text x="138" y="362" fill="#8b949e" font-size="12.5">:4096 · agent runtime</text>
  <text x="138" y="381" fill="#8b949e" font-size="12.5">skills · personas · plugins</text>

  <rect x="350" y="318" width="210" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="368" y="342" fill="#e6edf3" font-size="13" font-weight="600">Thread screen</text>
  <text x="368" y="362" fill="#8b949e" font-size="12.5">Xvfb + openbox · VNC</text>
  <text x="368" y="381" fill="#8b949e" font-size="12.5">browser · native apps · CDP</text>

  <!-- viking container -->
  <rect x="620" y="270" width="460" height="150" rx="10" fill="#1c2431" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="650" y="300" fill="#2dd4bf" font-size="16" font-weight="700">OpenViking</text>
  <text x="760" y="300" fill="#8b949e" font-size="12.5">memory server per user</text>

  <rect x="650" y="318" width="200" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="668" y="342" fill="#e6edf3" font-size="13" font-weight="600">Memory server</text>
  <text x="668" y="362" fill="#8b949e" font-size="12.5">:1933 · context + recall</text>
  <text x="668" y="381" fill="#8b949e" font-size="12.5">prefs · docs · skills</text>

  <rect x="870" y="318" width="180" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="888" y="342" fill="#e6edf3" font-size="13" font-weight="600">AI models</text>
  <text x="888" y="362" fill="#8b949e" font-size="12.5">embeddings + VLM</text>
  <text x="888" y="381" fill="#8b949e" font-size="12.5">semantic search</text>

  <!-- memory link desktop <-> viking -->
  <line x1="590" y1="345" x2="620" y2="345" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrowTeal)" marker-start="url(#arrowTeal)"/>

  <!-- browser -->
  <rect x="440" y="500" width="300" height="76" rx="10" fill="#1c2431" stroke="#30363d"/>
  <text x="590" y="532" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Browser dashboard</text>
  <text x="590" y="554" text-anchor="middle" fill="#8b949e" font-size="12.5">chat · workspace views · config</text>

  <line x1="590" y1="466" x2="590" y2="496" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
</svg>
