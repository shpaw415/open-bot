services:
  open-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: open-bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "${PUBLISH_HOST:-100.96.0.3}:${PUBLISH_PORT:-8787}:8787"
    environment:
      OPEN_BOT_IN_DOCKER: "1"
      OPEN_BOT_DEV: ${OPEN_BOT_DEV:-0}
      CONTROL_CONTAINER: open-bot
      DATA_DIR: /data
      OPEN_BOT_AI_CONFIG: /app/config/ai.ts
      BIND_HOST: "0.0.0.0"
      PORT: "8787"
      OPEN_BOT_MARKETPLACE_URL: ${OPEN_BOT_MARKETPLACE_URL:-}
      OPEN_BOT_MARKETPLACE_TOKEN: ${OPEN_BOT_MARKETPLACE_TOKEN:-}
      OPEN_BOT_GITHUB_TOKEN: ${OPEN_BOT_GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - open-bot-data:/data
      - ../config/ai.ts:/app/config/ai.ts:ro

volumes:
  open-bot-data:
